services:
  argus:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

    # Non-secret config (watchlist, intervals, thresholds, etc.)
    env_file:
      - .env

    # Secrets — injected from the host environment at runtime.
    # Never hardcode values here. On the Mac Mini, export these in ~/.zshrc
    # or use: export ANTHROPIC_API_KEY=... before running docker compose up.
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ROBINHOOD_PASSWORD=${ROBINHOOD_PASSWORD}
      - ROBINHOOD_MFA_SECRET=${ROBINHOOD_MFA_SECRET:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}

    volumes:
      - argus-data:/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  prometheus:
    image: prom/prometheus:v2.51.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - argus

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  argus-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
